[package]
name = "katsuba-py"
version = "0.7.2"
authors = ["Valentin B. <valentin.be@protonmail.com>"]
description = "Python language bindings to Katsuba libraries"
license = "ISC"
edition = "2024"

[lib]
name = "katsuba"
crate-type = ["cdylib"]

[dependencies]
katsuba-bcd = { path = "../katsuba-bcd", features = ["python"] }
katsuba-nav = { path = "../katsuba-nav", features = ["python"] }
katsuba-object-property = { path = "../katsuba-object-property" }
katsuba-poi = { path = "../katsuba-poi", features = ["python"] }
katsuba-types = { path = "../katsuba-types" }
katsuba-utils = { path = "../katsuba-utils", features = ["python"] }
katsuba-wad = { path = "../katsuba-wad" }

bytemuck = "1"
pyo3 = { workspace = true, features = ["abi3-py312"] }

[build-dependencies]
pyo3-build-config = { version = "0.30" }
