[package]
name = "katsuba-poi"
version = "0.1.0"
authors = ["Valentin B. <valentin.be@protonmail.com>"]
description = "Crate for working with Point of Interest files"
license = "ISC"
edition = "2024"

[features]
python = ["dep:pyo3", "katsuba-utils/python"]

[dependencies]
katsuba-utils = { path = "../katsuba-utils" }

pyo3 = { workspace = true, optional = true }
serde = { workspace = true }
